<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Europaige - Customer Portal</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f6f7f9}
header{background:#0f2040;color:white;padding:20px}
.wrap{padding:16px;max-width:800px;margin:auto}
.card{background:white;border-radius:12px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.total{font-weight:bold;font-size:18px;border-top:1px solid #eee;padding-top:10px}
button{background:#0f2040;color:white;border:0;padding:12px;border-radius:8px;width:100%}
</style>
</head>
<body>
<header><h1>EUROPAIGE</h1><p>Customer Portal - ABS Holdings Group</p></header>
<div class="wrap">
<div class="card">
<h2>123 Main St</h2>
<p>Home Renovation - Home Depot</p>
<p>Home Depot Bill: $4,200.00</p>
<p>Service Fee (15%): $630.00</p>
<p class="total">Total Due: $4,830.00</p>
<button>View PDF - Home Depot Bill</button>
</div>
</div>
</body>
</html>
